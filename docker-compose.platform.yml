services:
  migrate:
    environment:
      NODE_ENV: production

  api:
    ports: !reset []
    environment:
      AUTH_COOKIE_SECURE: 'true'
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET to at least 32 characters}
      FEATURE_AGENT_RUNTIME_ENABLED: 'false'
      FEATURE_AG_UI_STREAMING_ENABLED: 'false'
      FEATURE_RUNTIME_MEMORY_ENABLED: 'false'
      NODE_ENV: production

  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    ports: !reset []
    environment:
      # Point at a database and Redis logical database reserved for this Agent Server on the shared
      # platform services; never reuse the `langgraph` database owned by the platform's own server.
      DATABASE_URI: ${AGENT_DATABASE_URI:?Set AGENT_DATABASE_URI in .env}
      LANGCHAIN_TRACING_V2: 'false'
      LANGGRAPH_CLOUD_LICENSE_KEY: ${LANGGRAPH_CLOUD_LICENSE_KEY:?Set LANGGRAPH_CLOUD_LICENSE_KEY in .env}
      LANGSMITH_TRACING: 'false'
      REDIS_URI: ${AGENT_REDIS_URI:?Set AGENT_REDIS_URI in .env}
    networks: !override [data]

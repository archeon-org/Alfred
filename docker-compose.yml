name: alfred

# PostgreSQL and Redis are not provisioned here. Both come from the LangGraph platform stack in the
# sibling `langgraph-agent-repo` checkout (`docker compose up postgres redis` there), which
# publishes them on the host and exposes them to containers on the shared `data` network below.

services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: ['node', 'dist/database/run-migrations.js']
    environment:
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the shared PostgreSQL database in .env}
      HOME: /tmp
      NODE_ENV: development
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp
    user: '10001:10001'
    init: true
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-300}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:-6000}
      AUTH_OAUTH_START_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_OAUTH_START_IP_RATE_LIMIT_PER_MINUTE:-300}
      AUTH_OAUTH_CALLBACK_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_OAUTH_CALLBACK_IP_RATE_LIMIT_PER_MINUTE:-600}
      AUTH_REFRESH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_REFRESH_IP_RATE_LIMIT_PER_MINUTE:-1200}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alfred-web}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alfred-api}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET to at least 32 characters}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_SESSION_CLEANUP_INTERVAL_SECONDS: ${AUTH_SESSION_CLEANUP_INTERVAL_SECONDS:-3600}
      AUTH_SESSION_RETENTION_SECONDS: ${AUTH_SESSION_RETENTION_SECONDS:-2592000}
      AUTH_USER_RATE_LIMIT_PER_MINUTE: ${AUTH_USER_RATE_LIMIT_PER_MINUTE:-120}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the shared PostgreSQL database in .env}
      FEATURE_AGENT_RUNTIME_ENABLED: ${FEATURE_AGENT_RUNTIME_ENABLED:-false}
      FEATURE_AG_UI_STREAMING_ENABLED: ${FEATURE_AG_UI_STREAMING_ENABLED:-false}
      FEATURE_FILE_UPLOADS_ENABLED: ${FEATURE_FILE_UPLOADS_ENABLED:-false}
      FEATURE_GENERATIVE_UI_ENABLED: ${FEATURE_GENERATIVE_UI_ENABLED:-false}
      FEATURE_GOOGLE_OAUTH_ENABLED: ${FEATURE_GOOGLE_OAUTH_ENABLED:-false}
      FEATURE_MCP_APPS_ENABLED: ${FEATURE_MCP_APPS_ENABLED:-false}
      FEATURE_OUTPUT_STYLES_ENABLED: ${FEATURE_OUTPUT_STYLES_ENABLED:-false}
      FEATURE_KNOWLEDGE_SCOPE_ENABLED: ${FEATURE_KNOWLEDGE_SCOPE_ENABLED:-false}
      FEATURE_CONVERSATION_FEEDBACK_ENABLED: ${FEATURE_CONVERSATION_FEEDBACK_ENABLED:-false}
      FEATURE_RATE_LIMITING_ENABLED: ${FEATURE_RATE_LIMITING_ENABLED:-true}
      FEATURE_OPENAPI_ENABLED: ${FEATURE_OPENAPI_ENABLED:-true}
      FEATURE_RUNTIME_MEMORY_ENABLED: ${FEATURE_RUNTIME_MEMORY_ENABLED:-false}
      FEATURE_SKILLS_ENABLED: ${FEATURE_SKILLS_ENABLED:-false}
      FEATURE_TEAMS_ENABLED: ${FEATURE_TEAMS_ENABLED:-false}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-}
      NODE_ENV: development
      OBSERVABILITY_LOG_LEVEL: ${OBSERVABILITY_LOG_LEVEL:-info}
      OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-false}
      OBSERVABILITY_METRICS_TOKEN: ${OBSERVABILITY_METRICS_TOKEN:-}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the shared Redis instance in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5173}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - data
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile.dev
    environment:
      LANGGRAPH_SERVER_PORT: 8000
    ports:
      - '127.0.0.1:${AGENT_PORT:-2024}:8000'
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ok', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
      - /app/.langgraph_api:uid=10001,gid=10001,mode=0700
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  app:
  # Pre-existing network of the LangGraph platform stack; `postgres` and `redis` resolve on it.
  data:
    name: ${DATA_NETWORK:-langgraph-agent-repo_agent-network}
    external: true

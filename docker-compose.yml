name: alfred

# PostgreSQL and Redis are not provisioned here. Both come from the LangGraph platform stack in the
# sibling `langgraph-agent-repo` checkout (`docker compose up postgres redis` there), which
# publishes them on the host and exposes them to containers on the shared `data` network below.

services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: ['node', 'dist/database/run-migrations.js']
    environment:
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the shared PostgreSQL database in .env}
      HOME: /tmp
      NODE_ENV: development
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp
    user: '10001:10001'
    init: true
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Existing LangGraph server alias on the shared platform network.
      AGENT_RUNTIME_ASSISTANT_ID: ${AGENT_RUNTIME_ASSISTANT_ID:-orchestrator}
      AGENT_RUNTIME_TITLE_ASSISTANT_ID: ${AGENT_RUNTIME_TITLE_ASSISTANT_ID-title_agent}
      AGENT_RUNTIME_URL: ${AGENT_RUNTIME_URL:-http://agents-api:8000}
      EXECUTION_CURSOR_KEY: ${EXECUTION_CURSOR_KEY:-}
      EXECUTION_CURSOR_KEY_PREVIOUS: ${EXECUTION_CURSOR_KEY_PREVIOUS:-}
      EXECUTION_COMMIT_WINDOW_MS: ${EXECUTION_COMMIT_WINDOW_MS:-500}
      EXECUTION_WORK_LOG_CONTENT_ENABLED: ${EXECUTION_WORK_LOG_CONTENT_ENABLED:-true}
      EXECUTION_CURSOR_TTL_MS: ${EXECUTION_CURSOR_TTL_MS:-3600000}
      EXECUTION_DEADLINE_MS: ${EXECUTION_DEADLINE_MS:-600000}
      EXECUTION_LEASE_MS: ${EXECUTION_LEASE_MS:-30000}
      EXECUTION_WORKER_CONCURRENCY: ${EXECUTION_WORKER_CONCURRENCY:-4}
      EXECUTION_MAX_ACTIVE_PER_USER: ${EXECUTION_MAX_ACTIVE_PER_USER:-4}
      EXECUTION_MAX_ACTIVE_GLOBAL: ${EXECUTION_MAX_ACTIVE_GLOBAL:-64}
      EXECUTION_SSE_HEARTBEAT_MS: ${EXECUTION_SSE_HEARTBEAT_MS:-25000}
      EXECUTION_SSE_DRAIN_TIMEOUT_MS: ${EXECUTION_SSE_DRAIN_TIMEOUT_MS:-10000}
      EXECUTION_SSE_MAX_FRAME_BYTES: ${EXECUTION_SSE_MAX_FRAME_BYTES:-2097152}
      EXECUTION_SSE_MAX_BUFFERED_BYTES: ${EXECUTION_SSE_MAX_BUFFERED_BYTES:-4194304}
      EXECUTION_MAX_OBSERVERS_PER_USER: ${EXECUTION_MAX_OBSERVERS_PER_USER:-4}
      EXECUTION_MAX_OBSERVERS_PER_INSTANCE: ${EXECUTION_MAX_OBSERVERS_PER_INSTANCE:-128}
      EXECUTION_OBSERVER_REAUTH_MS: ${EXECUTION_OBSERVER_REAUTH_MS:-25000}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-300}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:-6000}
      AUTH_OAUTH_START_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_OAUTH_START_IP_RATE_LIMIT_PER_MINUTE:-300}
      AUTH_OAUTH_CALLBACK_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_OAUTH_CALLBACK_IP_RATE_LIMIT_PER_MINUTE:-600}
      AUTH_REFRESH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_REFRESH_IP_RATE_LIMIT_PER_MINUTE:-1200}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-alfred-web}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-alfred-api}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET to at least 32 characters}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_SESSION_CLEANUP_INTERVAL_SECONDS: ${AUTH_SESSION_CLEANUP_INTERVAL_SECONDS:-3600}
      AUTH_SESSION_RETENTION_SECONDS: ${AUTH_SESSION_RETENTION_SECONDS:-2592000}
      AUTH_USER_RATE_LIMIT_PER_MINUTE: ${AUTH_USER_RATE_LIMIT_PER_MINUTE:-120}
      CONTEXT_DOCUMENT_MAX_BYTES: ${CONTEXT_DOCUMENT_MAX_BYTES:-65536}
      SKILLS_MAX_FILES: ${SKILLS_MAX_FILES:-50}
      SKILLS_MAX_PACKAGE_BYTES: ${SKILLS_MAX_PACKAGE_BYTES:-1048576}
      SKILLS_MAX_INSTRUCTIONS_BYTES: ${SKILLS_MAX_INSTRUCTIONS_BYTES:-131072}
      SKILLS_MAX_TOTAL_BYTES_PER_USER: ${SKILLS_MAX_TOTAL_BYTES_PER_USER:-26214400}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the shared PostgreSQL database in .env}
      FEATURE_AGENT_RUNTIME_ENABLED: ${FEATURE_AGENT_RUNTIME_ENABLED:-false}
      FEATURE_AG_UI_STREAMING_ENABLED: ${FEATURE_AG_UI_STREAMING_ENABLED:-false}
      FEATURE_FILE_UPLOADS_ENABLED: ${FEATURE_FILE_UPLOADS_ENABLED:-false}
      FEATURE_GENERATIVE_UI_ENABLED: ${FEATURE_GENERATIVE_UI_ENABLED:-false}
      FEATURE_GOOGLE_OAUTH_ENABLED: ${FEATURE_GOOGLE_OAUTH_ENABLED:-false}
      FEATURE_MCP_APPS_ENABLED: ${FEATURE_MCP_APPS_ENABLED:-false}
      FEATURE_OUTPUT_STYLES_ENABLED: ${FEATURE_OUTPUT_STYLES_ENABLED:-false}
      FEATURE_KNOWLEDGE_SCOPE_ENABLED: ${FEATURE_KNOWLEDGE_SCOPE_ENABLED:-false}
      FEATURE_CONVERSATION_FEEDBACK_ENABLED: ${FEATURE_CONVERSATION_FEEDBACK_ENABLED:-false}
      FEATURE_RATE_LIMITING_ENABLED: ${FEATURE_RATE_LIMITING_ENABLED:-true}
      FEATURE_OPENAPI_ENABLED: ${FEATURE_OPENAPI_ENABLED:-true}
      FEATURE_RUNTIME_MEMORY_ENABLED: ${FEATURE_RUNTIME_MEMORY_ENABLED:-false}
      FEATURE_SKILLS_ENABLED: ${FEATURE_SKILLS_ENABLED:-false}
      FEATURE_TEAMS_ENABLED: ${FEATURE_TEAMS_ENABLED:-false}
      FEATURE_TRACE_LINKS_ENABLED: ${FEATURE_TRACE_LINKS_ENABLED:-false}
      FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-5242880}
      FILE_QUOTA_BYTES_PER_USER: ${FILE_QUOTA_BYTES_PER_USER:-26214400}
      FILE_PENDING_UPLOAD_TTL_MS: ${FILE_PENDING_UPLOAD_TTL_MS:-300000}
      FILE_UPLOAD_USER_RATE_LIMIT_PER_MINUTE: ${FILE_UPLOAD_USER_RATE_LIMIT_PER_MINUTE:-20}
      FILE_UPLOAD_MAX_CONCURRENT: ${FILE_UPLOAD_MAX_CONCURRENT:-4}
      FILE_EXTRACTION_TIMEOUT_MS: ${FILE_EXTRACTION_TIMEOUT_MS:-60000}
      FILE_EXTRACTION_MAX_PDF_PAGES: ${FILE_EXTRACTION_MAX_PDF_PAGES:-500}
      FILE_EXTRACTED_TEXT_MAX_CHARS: ${FILE_EXTRACTED_TEXT_MAX_CHARS:-1000000}
      FILE_IMAGE_MAX_EDGE_PX: ${FILE_IMAGE_MAX_EDGE_PX:-1568}
      FILE_IMAGE_MAX_INPUT_PIXELS: ${FILE_IMAGE_MAX_INPUT_PIXELS:-50000000}
      FILE_PROMPT_TOKENS_PER_DOCUMENT: ${FILE_PROMPT_TOKENS_PER_DOCUMENT:-10000}
      FILE_PROMPT_TOKENS_PER_EXECUTION: ${FILE_PROMPT_TOKENS_PER_EXECUTION:-30000}
      # Uploaded file bytes. The API container has a read-only filesystem, so a Compose run that
      # turns uploads on points at the `files` profile bucket below rather than at a local folder.
      FILE_STORAGE_S3_ENDPOINT: ${FILE_STORAGE_S3_ENDPOINT:-}
      FILE_STORAGE_S3_BUCKET: ${FILE_STORAGE_S3_BUCKET:-}
      FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-}
      FILE_STORAGE_S3_ACCESS_KEY_ID: ${FILE_STORAGE_S3_ACCESS_KEY_ID:-}
      FILE_STORAGE_S3_SECRET_ACCESS_KEY: ${FILE_STORAGE_S3_SECRET_ACCESS_KEY:-}
      FILE_STORAGE_S3_SESSION_TOKEN: ${FILE_STORAGE_S3_SESSION_TOKEN:-}
      FILE_STORAGE_S3_FORCE_PATH_STYLE: ${FILE_STORAGE_S3_FORCE_PATH_STYLE:-}
      FILE_STORAGE_S3_PREFIX: ${FILE_STORAGE_S3_PREFIX:-}
      TRACE_LINK_UI_URL: ${TRACE_LINK_UI_URL:-https://smith.langchain.com}
      TRACE_LINK_ORGANIZATION_ID: ${TRACE_LINK_ORGANIZATION_ID:-}
      TRACE_LINK_PROJECT_ID: ${TRACE_LINK_PROJECT_ID:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-}
      NODE_ENV: development
      OBSERVABILITY_LOG_LEVEL: ${OBSERVABILITY_LOG_LEVEL:-info}
      OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-false}
      OBSERVABILITY_METRICS_TOKEN: ${OBSERVABILITY_METRICS_TOKEN:-}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the shared Redis instance in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5173}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - data
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_DEBUG_EVENTS: ${VITE_DEBUG_EVENTS:-false}
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile.dev
    environment:
      LANGGRAPH_SERVER_PORT: 8000
    ports:
      - '127.0.0.1:${AGENT_PORT:-2024}:8000'
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ok', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
      - /app/.langgraph_api:uid=10001,gid=10001,mode=0700
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # An S3-compatible bucket for local work on uploads, started on demand:
  # `docker compose --profile files up minio minio-bucket`. It stands in for whichever provider a
  # deployment uses — AWS S3, Cloudflare R2, IBM COS or MinIO itself — and the API talks to all of
  # them through the same adapter. The root credentials below administer the server; the API gets
  # its own user, limited to the bucket, from the `minio-bucket` step. Both services keep `:-`
  # defaults on purpose: a `:?` here would break every Compose command while the profile is off.
  minio:
    # MinIO publishes its images on quay.io; the Docker Hub repository is gone.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ['files']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alfred-minio-admin}
      # Empty makes the server refuse to start; `pnpm setup:env` generates a value.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    networks:
      - app
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Creates the bucket and a user that may only read, write and delete objects in it. Re-runnable.
  minio-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ['files']
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Every capability is dropped below, so `mc` cannot write its configuration under /root.
      MC_CONFIG_DIR: /tmp/mc
      ROOT_USER: ${MINIO_ROOT_USER:-alfred-minio-admin}
      ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      BUCKET: ${FILE_STORAGE_S3_BUCKET:-alfred-files}
      APP_KEY: ${FILE_STORAGE_S3_ACCESS_KEY_ID:-alfred-api}
      APP_SECRET: ${FILE_STORAGE_S3_SECRET_ACCESS_KEY:-}
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        if [ -z "$$APP_SECRET" ]; then
          echo 'Set FILE_STORAGE_S3_SECRET_ACCESS_KEY (at least 8 characters) in .env to use the files profile' >&2
          exit 1
        fi
        mc alias set local http://minio:9000 "$$ROOT_USER" "$$ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$BUCKET"
        mc anonymous set none "local/$$BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$$BUCKET"'/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::'"$$BUCKET"'"]}]}' > /tmp/policy.json
        mc admin policy create local "$$BUCKET-objects" /tmp/policy.json
        mc admin user add local "$$APP_KEY" "$$APP_SECRET"
        mc admin policy attach local "$$BUCKET-objects" --user "$$APP_KEY" || true
    networks:
      - app
    init: true
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  minio-data:

networks:
  app:
  # Pre-existing network of the LangGraph platform stack; `postgres` and `redis` resolve on it.
  data:
    name: ${DATA_NETWORK:-langgraph-agent-repo_agent-network}
    external: true

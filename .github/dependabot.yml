version: 2
# All update PRs target develop: main only receives release merges from develop,
# so its manifests and workflows lag behind and updates against it are stale.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    groups:
      # Framework runtime and test adapter must move together across major versions.
      nestjs-framework:
        patterns:
          - '@nestjs/common'
          - '@nestjs/core'
          - '@nestjs/platform-express'
          - '@nestjs/testing'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # Keep unrelated major upgrades in separate PRs for focused compatibility review.
      javascript-development:
        dependency-type: development
        update-types: [minor, patch]
      javascript-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/agent
    schedule:
      interval: weekly
      day: monday
    target-branch: develop

  - package-ecosystem: docker
    directories:
      - /apps/agent
      - /apps/api
      - /apps/web
      - /infra/postgres
    schedule:
      interval: weekly
      day: monday
    target-branch: develop

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop

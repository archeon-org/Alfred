name: Bug report
description: Report a reproducible problem in Alfred
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, tokens, personal data or production credentials.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web
        - API
        - Agents / LangGraph
        - Docker / infrastructure
        - Developer tooling
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact error and sanitized logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List deterministic steps and the command you ran.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Git revision
      placeholder: commit SHA or branch name
    validations:
      required: true

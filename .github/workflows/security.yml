name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  committed-secret-history:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete Git history with Gitleaks
        run: |
          docker run --rm \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --redact --verbose --no-banner /repo

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.9'

      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/agent --frozen --all-groups
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high
      - name: Audit Python dependencies
        run: uv run --frozen --project apps/agent pip-audit

  sast:
    name: Source security scan (Semgrep CE)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull the pinned scanner
        run: docker pull semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
      - name: Test local security rules and scan source without network access
        run: |
          scan() {
            docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,size=1g --env HOME=/tmp \
              --volume "$PWD:/src:ro" --workdir /src \
              --volume "$PWD/.semgrep.yml:/rules/security.yml:ro" \
              --volume "$PWD/scripts/security/security.ts:/rules/security.ts:ro" \
              --volume "$PWD/scripts/security/security.py:/rules/security.py:ro" \
              semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e \
              semgrep scan --metrics off --disable-version-check "$@"
          }
          scan --test /rules
          scan --strict --error --config .semgrep.yml --exclude scripts/security apps packages scripts

  repository-scan:
    name: Vulnerability, secret and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          exit-code: '1'
          format: table
          ignore-unfixed: false
          scan-ref: .
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: alfred-sbom.cdx.json
          format: cyclonedx-json
          path: .

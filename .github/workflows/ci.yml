name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-gate:
    name: Style (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn --cwd apps/gate eslint "{src,test}/**/*.ts" --max-warnings=0

  style-native:
    name: Style (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run Prettier checks
        run: >
          yarn prettier --check
          "apps/native/src/**/*.{ts,tsx}"
          "apps/native/test/**/*.{ts,tsx}"
          "apps/native/scripts/**/*.js"
          "apps/native/*.js"
          "apps/native/*.ts"
          "apps/native/*.json"

  style-scribe:
    name: Style (scribe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: cd apps/scribe && uv sync --frozen --extra dev
      - name: Run Ruff format check
        run: cd apps/scribe && uv run --frozen ruff format --check src tests
      - name: Run Ruff lint
        run: cd apps/scribe && uv run --frozen ruff check src tests

  test-gate:
    name: Test (gate)
    needs:
      - style-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn --cwd apps/gate test --runInBand

  test-native:
    name: Test (native)
    needs:
      - style-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn --cwd apps/native test --runInBand

  test-scribe:
    name: Test (scribe)
    needs:
      - style-scribe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: cd apps/scribe && uv sync --frozen --extra dev
      - name: Run tests
        run: cd apps/scribe && PYTHONPATH=src uv run --frozen pytest -q

name: Expo CI/CD

on:
  push:
    branches:
      - main
      - staging
      - develop
      - "feat/**"
      - "fix/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main
      - staging
      - develop
      - "feat/**"
      - "fix/**"
      - "bugfix/**"

env:
  NODE_VERSION: "22.x"
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  # API_URL: ${{ secrets.EXPO_API_URL }}
  # API_TIMEOUT: ${{ secrets.EXPO_API_TIMEOUT }}
  # MINIO_URL: ${{ secrets.EXPO_MINIO_URL }}
  # GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_GOOGLE_WEB_CLIENT_ID }}
  # GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_GOOGLE_IOS_CLIENT_ID }}
  # DEBUG_MODE: ${{ secrets.EXPO_DEBUG_MODE }}

jobs:
  check-changes:
    name: Check for archeon app changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_files.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for file changes in archeon directory
        id: check_files
        uses: tj-actions/changed-files@v42
        with:
          files: apps/archeon/**

      - name: List changed files
        if: steps.check_files.outputs.any_changed == 'true'
        run: |
          echo "Archeon app files changed, publish will proceed"
          echo "Changed files:"
          echo "${{ steps.check_files.outputs.all_changed_files }}"

      - name: No changes detected
        if: steps.check_files.outputs.any_changed != 'true'
        run: echo "No Archeon app files changed, publish will be skipped"

  eas-update-publish:
    name: EAS Update - Publish to Expo Go
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ env.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
          expo-cache: true

      - name: Install dependencies
        run: yarn

      # - name: Create env file for EAS
      #   run: |
      #       cd apps/archeon
      #       echo "API_URL=${{ env.API_URL }}" > .env
      #       echo "API_TIMEOUT=${{ env.API_TIMEOUT }}" >> .env
      #       cat .env

      - name: Publish to Expo Go
        run: |
          cd apps/archeon
          eas update --auto --non-interactive

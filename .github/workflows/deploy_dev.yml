name: 🚀 CI/CD Pipeline - Develop Branch

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment even if no changes detected"
        required: false
        default: false
        type: boolean
      deploy_target:
        description: "What to deploy"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - gate
          - scribe

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_GATE: archeon-gate
  IMAGE_NAME_SCRIBE: archeon-scribe
  ANSIBLE_HOST_KEY_CHECKING: False

jobs:
  # ============================================================================
  # 1️⃣ CHANGES DETECTION
  # ============================================================================
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.changes.outputs.gate }}
      scribe: ${{ steps.changes.outputs.scribe }}
      force_deploy: ${{ steps.changes.outputs.force_deploy }}
      any_changes: ${{ steps.changes.outputs.gate == 'true' || steps.changes.outputs.scribe == 'true' }}
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check for changes
        id: changes
        run: |
          echo "Detecting changes..."

          # Determine the commit range
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"

          # Handle manual runs or new branches where 'before' might be empty or zero
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1 HEAD"
          else
            RANGE="$BEFORE $SHA"
          fi

          echo "Checking changes in range: $RANGE"
          CHANGED_FILES=$(git diff --name-only $RANGE)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check for [force deploy] in commit message
          if echo "$COMMIT_MESSAGE" | grep -q "\[force deploy\]"; then
            echo "force_deploy=true" >> $GITHUB_OUTPUT
            echo "Force deploy flag detected in commit message."
          else
            echo "force_deploy=false" >> $GITHUB_OUTPUT
          fi

          # Check for Gate changes
          if echo "$CHANGED_FILES" | grep -qE '^apps/gate/|^packages/'; then
            echo "gate=true" >> $GITHUB_OUTPUT
            echo "Gate changes detected."
          else
            echo "gate=false" >> $GITHUB_OUTPUT
            echo "No Gate changes."
          fi

          # Check for Scribe changes
          if echo "$CHANGED_FILES" | grep -qE '^apps/scribe/|^packages/'; then
            echo "scribe=true" >> $GITHUB_OUTPUT
            echo "Scribe changes detected."
          else
            echo "scribe=false" >> $GITHUB_OUTPUT
            echo "No Scribe changes."
          fi

      - name: 📊 Changes Summary
        run: |
          echo "## 🔍 Changes Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Gate Changes:** ${{ steps.changes.outputs.gate == 'true' && '✅ Yes' || '❌ No' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scribe Changes:** ${{ steps.changes.outputs.scribe == 'true' && '✅ Yes' || '❌ No' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force Deploy:** ${{ (github.event.inputs.force_deploy == 'true' || steps.changes.outputs.force_deploy == 'true') && '✅ Yes' || '❌ No' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 2️⃣ SETUP ENVIRONMENTS
  # ============================================================================
  setup-envs:
    name: 🔧 Setup Environments
    needs: changes
    if: |
      needs.changes.outputs.gate == 'true' || needs.changes.outputs.scribe == 'true' || 
      github.event.inputs.force_deploy == 'true' || needs.changes.outputs.force_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: 🔑 Create vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
        shell: bash

      - name: 📝 Create Ansible configuration
        run: |
          cat > ansible.cfg << 'ANSIBLE_EOF'
          [defaults]
          inventory = ansible/inventory.yml
          vault_password_file = .vault_pass
          host_key_checking = False
          timeout = 30
          gather_timeout = 30

          [ssh_connection]
          ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          pipelining = True
          timeout = 30
          ANSIBLE_EOF

      - name: 🔧 Setup .env files on all VPS
        run: |
          ansible-playbook ansible/playbooks/02-setup-app-env.yml \
            --vault-password-file .vault_pass \
            -v

      - name: 🧹 Cleanup sensitive files
        if: always()
        run: |
          rm -f .vault_pass
        shell: bash

  # ============================================================================
  # 3️⃣ BUILD GATE
  # ============================================================================
  build-gate:
    name: 🏗️ Build Gate
    needs: [changes, setup-envs]
    if: |
      always() &&
      (needs.setup-envs.result == 'success' || needs.setup-envs.result == 'skipped') &&
      (needs.changes.outputs.gate == 'true' || github.event.inputs.force_deploy == 'true' || needs.changes.outputs.force_deploy == 'true') &&
      (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'gate' || github.event.inputs.deploy_target == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Extract metadata for gate
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_GATE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: 🏗️ Build and push gate Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/gate/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_GATE }}:cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_GATE }}:cache,mode=max
          build-args: |
            NODE_ENV=production
            BUILDKIT_INLINE_CACHE=1

  # ============================================================================
  # 3️⃣ BUILD SCRIBE
  # ============================================================================
  build-scribe:
    name: ✍️ Build Scribe
    needs: [changes, setup-envs]
    if: |
      always() &&
      (needs.setup-envs.result == 'success' || needs.setup-envs.result == 'skipped') &&
      (needs.changes.outputs.scribe == 'true' || github.event.inputs.force_deploy == 'true' || needs.changes.outputs.force_deploy == 'true') &&
      (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'scribe' || github.event.inputs.deploy_target == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Extract metadata for scribe
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_SCRIBE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: 🏗️ Build and push scribe Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/scribe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_SCRIBE }}:cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_SCRIBE }}:cache,mode=max
          build-args: |
            NODE_ENV=production
            BUILDKIT_INLINE_CACHE=1

  # ============================================================================
  # 4️⃣ DEPLOY GATE TO MAIN VPS
  # ============================================================================
  deploy-gate:
    name: 🚀 Deploy Gate to Main VPS
    needs: [changes, build-gate]
    if: |
      always() && 
      needs.build-gate.result == 'success' &&
      (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'gate' || github.event.inputs.deploy_target == '')
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: 🔧 Install Ansible Docker collection
        run: |
          ansible-galaxy collection install community.docker

      - name: 🔑 Create vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
        shell: bash

      - name: 📝 Create Ansible configuration
        run: |
          cat > ansible.cfg << 'ANSIBLE_EOF'
          [defaults]
          inventory = ansible/inventory.yml
          vault_password_file = .vault_pass
          host_key_checking = False
          timeout = 30
          gather_timeout = 30

          [ssh_connection]
          ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          pipelining = True
          timeout = 30
          ANSIBLE_EOF

      - name: 🔍 Test Ansible connection to Main VPS
        run: |
          ansible archeon-vps -m ping -v

      - name: 🚀 Deploy Gate to Main VPS
        run: |
          ansible-playbook ansible/playbooks/05-deploy-from-registry.yml \
            --extra-vars "deployment_tag=latest" \
            --vault-password-file .vault_pass \
            -v

      - name: 🧹 Cleanup sensitive files
        if: always()
        run: |
          rm -f .vault_pass
        shell: bash

  # ============================================================================
  # 4️⃣ DEPLOY SCRIBE TO WORKER VPS
  # ============================================================================
  deploy-scribe:
    name: 🚀 Deploy Scribe Workers
    needs: [changes, build-scribe]
    if: |
      always() && 
      needs.build-scribe.result == 'success' &&
      (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'scribe' || github.event.inputs.deploy_target == '')
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: 🔧 Install Ansible Docker collection
        run: |
          ansible-galaxy collection install community.docker

      - name: 🔑 Create vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
        shell: bash

      - name: 📝 Create Ansible configuration
        run: |
          cat > ansible.cfg << 'ANSIBLE_EOF'
          [defaults]
          inventory = ansible/inventory.yml
          vault_password_file = .vault_pass
          host_key_checking = False
          timeout = 30
          gather_timeout = 30

          [ssh_connection]
          ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          pipelining = True
          timeout = 30
          ANSIBLE_EOF

      - name: 🔍 Test Ansible connection to Scribe Workers
        run: |
          ansible scribe_workers -m ping -v

      - name: 🚀 Deploy Scribe Workers (3 containers per VPS)
        run: |
          ansible-playbook ansible/playbooks/06-deploy-scribe-workers.yml \
            --extra-vars "deployment_tag=latest" \
            --vault-password-file .vault_pass \
            -v

      - name: 🧹 Cleanup sensitive files
        if: always()
        run: |
          rm -f .vault_pass
        shell: bash

  # ============================================================================
  # 5️⃣ FINAL SUMMARY
  # ============================================================================
  summary:
    name: 📊 Pipeline Summary
    needs:
      [
        changes,
        setup-envs,
        build-gate,
        build-scribe,
        deploy-gate,
        deploy-scribe,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Generate Final Summary
        run: |
          echo "# 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔍 1. Changes Detection" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changes Detected |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Gate | ${{ needs.changes.outputs.gate == 'true' && '✅ Yes' || '❌ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✍️ Scribe | ${{ needs.changes.outputs.scribe == 'true' && '✅ Yes' || '❌ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔧 2. Environment Setup" >> $GITHUB_STEP_SUMMARY
          setup_envs="${{ needs.setup-envs.result }}"
          if [[ "$setup_envs" == "success" ]]; then
            echo "- **Status:** ✅ .env files updated on all VPS" >> $GITHUB_STEP_SUMMARY
          elif [[ "$setup_envs" == "skipped" ]]; then
            echo "- **Status:** ⏭️ Skipped (no changes detected)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🏗️ 3. Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          gate_build="${{ needs.build-gate.result }}"
          scribe_build="${{ needs.build-scribe.result }}"

          if [[ "$gate_build" == "success" ]]; then
            echo "| 🏗️ Gate | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$gate_build" == "skipped" ]]; then
            echo "| 🏗️ Gate | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Gate | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$scribe_build" == "success" ]]; then
            echo "| ✍️ Scribe | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$scribe_build" == "skipped" ]]; then
            echo "| ✍️ Scribe | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ✍️ Scribe | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 4. Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY

          gate_deploy="${{ needs.deploy-gate.result }}"
          scribe_deploy="${{ needs.deploy-scribe.result }}"

          if [[ "$gate_deploy" == "success" ]]; then
            echo "| 🏗️ Gate (Main VPS) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$gate_deploy" == "skipped" ]]; then
            echo "| 🏗️ Gate (Main VPS) | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Gate (Main VPS) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$scribe_deploy" == "success" ]]; then
            echo "| ✍️ Scribe Workers (2 VPS × 3 workers) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$scribe_deploy" == "skipped" ]]; then
            echo "| ✍️ Scribe Workers (2 VPS × 3 workers) | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ✍️ Scribe Workers (2 VPS × 3 workers) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 5. Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **Gate API:** https://gate.archeon.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** https://gate.archeon.com/api/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 6. Container Images" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`ghcr.io/${{ github.repository_owner }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Gate:** \`archeon-gate:latest\`" >> $GITHUB_STEP_SUMMARY  
          echo "- **Scribe:** \`archeon-scribe:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🖥️ 7. Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "| VPS | Role | Containers |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Main VPS | Gate API + PostgreSQL + Redis | archeon-gate, postgres-archeon, redis-archeon |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker VPS 1 | Scribe Workers | scribe-worker-1, scribe-worker-2, scribe-worker-3 |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker VPS 2 | Scribe Workers | scribe-worker-1, scribe-worker-2, scribe-worker-3 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Pipeline completed at $(date -u)*" >> $GITHUB_STEP_SUMMARY

      - name: 🚨 Notify on Failure
        if: failure()
        run: |
          echo "## ⚠️ Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The CI/CD pipeline encountered errors. Please check the logs and fix the issues." >> $GITHUB_STEP_SUMMARY

services:
  postgres-archeon:
    container_name: postgres-archeon
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-archeon-storage:/var/lib/postgresql/data/
    networks:
      - archeon-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-archeon:
    container_name: redis-archeon
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis-archeon-storage:/data
    command: redis-server --appendonly yes --requirepass RedisPassword123
    networks:
      - archeon-net
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "RedisPassword123",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  neo4j-archeon:
    container_name: neo4j-archeon
    image: neo4j:5.26.0-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/archeon123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-archeon-data:/data
      - neo4j-archeon-logs:/logs
    networks:
      - archeon-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5

  gate:
    container_name: archeon-gate
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ../:/app
      - gate-node-modules:/app/node_modules
      - gate-app-node-modules:/app/apps/gate/node_modules
      - yarn-cache:/root/.yarn
    env_file:
      - ../apps/gate/.env
    command: >
      sh -c "
        yarn install &&
        yarn workspace @archeon-org/types build &&
        yarn workspace @archeon-org/database build &&
        yarn workspace @archeon-org/module build &&
        yarn workspace gate start:dev
      "
    depends_on:
      postgres-archeon:
        condition: service_healthy
      redis-archeon:
        condition: service_healthy
    networks:
      - archeon-net
    restart: unless-stopped

    tty: true

  scribe-api:
    container_name: archeon-scribe-api
    build:
      context: ../apps/scribe
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../apps/scribe/src:/app/src:ro
    env_file:
      - ../apps/scribe/.env
    depends_on:
      postgres-archeon:
        condition: service_healthy
      redis-archeon:
        condition: service_healthy
      neo4j-archeon:
        condition: service_healthy
    networks:
      - archeon-net
    restart: unless-stopped

  scribe-worker:
    container_name: archeon-scribe-worker
    build:
      context: ../apps/scribe
      dockerfile: Dockerfile.dev
    volumes:
      - ../apps/scribe/src:/app/src:ro
    env_file:
      - ../apps/scribe/.env
    command: >
      watchfiles 
      --filter python 
      'celery -A core.celery_app worker --loglevel=DEBUG --concurrency=2'
      /app/src
    depends_on:
      postgres-archeon:
        condition: service_healthy
      redis-archeon:
        condition: service_healthy
      neo4j-archeon:
        condition: service_healthy
    networks:
      - archeon-net
    restart: unless-stopped

  # =============================================================================
  # Monitoring Stack (Prometheus + Grafana + Loki)
  # =============================================================================

  prometheus:
    container_name: archeon-prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - archeon-net

  grafana:
    container_name: archeon-grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=archeon123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - archeon-net

  loki:
    container_name: archeon-loki
    image: grafana/loki:latest
    restart: unless-stopped
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - archeon-net

  promtail:
    container_name: archeon-promtail
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - archeon-net

  # Prometheus Pushgateway for Celery worker metrics
  pushgateway:
    container_name: archeon-pushgateway
    image: prom/pushgateway:latest
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - archeon-net

  # Redis Exporter for Prometheus
  redis-exporter:
    container_name: archeon-redis-exporter
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-archeon:6379
      - REDIS_PASSWORD=RedisPassword123
    ports:
      - "9121:9121"
    depends_on:
      - redis-archeon
    networks:
      - archeon-net

  # PostgreSQL Exporter for Prometheus
  postgres-exporter:
    container_name: archeon-postgres-exporter
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres-archeon:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres-archeon:
        condition: service_healthy
    networks:
      - archeon-net

networks:
  archeon-net:
    driver: bridge

volumes:
  postgres-archeon-storage:
  redis-archeon-storage:
  neo4j-archeon-data:
  neo4j-archeon-logs:
  gate-node-modules:
  gate-app-node-modules:
  yarn-cache:
  prometheus-data:
  grafana-data:
  loki-data:

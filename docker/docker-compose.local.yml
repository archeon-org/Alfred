services:
  postgres-archeon:
    container_name: postgres-archeon
    image: ankane/pgvector:latest
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-archeon-storage:/var/lib/postgresql/data/
    networks:
      - archeon-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-archeon:
    container_name: redis-archeon
    image: redis:alpine
    ports:
      - "6378:6379"
    volumes:
      - redis-archeon-storage:/data
    command: redis-server --appendonly yes --requirepass RedisPassword123
    networks:
      - archeon-net
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "RedisPassword123",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  gate:
    container_name: archeon-gate
    image: archeon-gate:local
    ports:
      - "3000:3000"
    env_file:
      - ../apps/gate/.env
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres-archeon
      - DATABASE_PORT=5432
      - REDIS_HOST=redis-archeon
      - REDIS_PORT=6379
    depends_on:
      postgres-archeon:
        condition: service_healthy
      redis-archeon:
        condition: service_healthy
    networks:
      - archeon-net

  scribe:
    container_name: archeon-scribe
    image: archeon-scribe:local
    ports:
      - "3001:3000"
    env_file:
      - ../apps/scribe/.env
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres-archeon
      - DATABASE_PORT=5432
      - REDIS_HOST=redis-archeon
      - REDIS_PORT=6379
    depends_on:
      postgres-archeon:
        condition: service_healthy
      redis-archeon:
        condition: service_healthy
    networks:
      - archeon-net

networks:
  archeon-net:
    driver: bridge

volumes:
  postgres-archeon-storage: {}
  redis-archeon-storage: {}

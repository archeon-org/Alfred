---
all:
  children:
    # Control VPS - runs Coolify dashboard
    control:
      hosts:
        coolify-master:
          ansible_host: 161.97.135.50

    # Node VPS - managed by Coolify
    # Add nodes via: yarn ansible -> 4) Add a new node
    nodes:
      hosts:
        node-1:
          ansible_host: 185.172.57.106

  # Default connection vars (hardened)
  vars:
    ansible_user: deploy
    ansible_port: 2222
    ansible_ssh_private_key_file: ~/.ssh/archeon_vps
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

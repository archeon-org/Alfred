---
# ═══════════════════════════════════════════════════
#  Coolify role — default variables
# ═══════════════════════════════════════════════════

coolify_install_url: "https://cdn.coollabs.io/coolify/install.sh"
coolify_data_dir: "/data/coolify"
coolify_ports:
  - "8000"
  - "6001"
  - "6002"

# Docker
docker_edition: "ce"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - docker-buildx-plugin

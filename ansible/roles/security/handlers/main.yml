---
- name: Restart SSH
  ansible.builtin.systemd:
    name: "{{ ssh_service_name }}"
    state: restarted
    daemon_reload: yes

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Reload UFW
  community.general.ufw:
    state: reloaded

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Restart unattended-upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: restarted

---
# ── Pre-create Coolify data directory with proper ACLs ──────
# Coolify (from the control VPS) creates /data/coolify on nodes via SSH
# as the deploy user with sudo. New directories inherit restrictive root
# permissions, blocking deploy from traversing them later.
#
# By pre-creating /data/coolify with POSIX default ACLs, ALL future
# subdirectories automatically inherit rwx for deploy + uid 9999
# (Coolify container). This eliminates permission issues for ANY
# Coolify feature: proxy, databases, applications, services, backups, etc.

- name: Ensure /data directory exists
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Coolify data directory exists
  ansible.builtin.file:
    path: /data/coolify
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set ACLs on Coolify data directory (dirs=rwx, files=rw, SSH keys protected)
  ansible.builtin.shell: |
    # Default ACLs on directories — inherited by all future files/dirs
    find /data/coolify -type d -exec setfacl -m u:{{ admin_user }}:rwx,u:9999:rwx,d:u:{{ admin_user }}:rwx,d:u:9999:rwx,d:m::rwx {} +
    # Directories: deploy + 9999 get rwx, mask rwx
    find /data/coolify -type d -exec setfacl -m m::rwx {} +
    # Files: deploy + 9999 get rw (no execute), mask rw
    find /data/coolify -type f -exec setfacl -m u:{{ admin_user }}:rw,u:9999:rw,m::rw {} + 2>/dev/null || true
    # SSH private keys MUST be 0600 — strip all ACLs
    find /data/coolify -type f \( -name 'ssh_key*' -o -name 'id.*' -o -name '*.pem' \) -exec setfacl -b {} \; -exec chmod 600 {} \;
  changed_when: true

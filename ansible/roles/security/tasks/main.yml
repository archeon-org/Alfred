---
# ═══════════════════════════════════════════════════
#  Security role — task orchestrator
# ═══════════════════════════════════════════════════

- name: Include package management
  ansible.builtin.include_tasks: packages.yml
  tags: [packages]

- name: Include user management
  ansible.builtin.include_tasks: users.yml
  tags: [users]

# SSH MUST run before firewall so port 2222 is live before port 22 is closed
- name: Include SSH hardening
  ansible.builtin.include_tasks: ssh.yml
  tags: [ssh]

- name: Include firewall setup
  ansible.builtin.include_tasks: firewall.yml
  tags: [firewall]

- name: Include fail2ban setup
  ansible.builtin.include_tasks: fail2ban.yml
  tags: [fail2ban]

- name: Include automatic updates
  ansible.builtin.include_tasks: auto-updates.yml
  tags: [updates]
  when: enable_auto_updates | bool

- name: Include kernel hardening
  ansible.builtin.include_tasks: kernel.yml
  tags: [kernel]
  when: kernel_hardening | bool

- name: Include additional hardening
  ansible.builtin.include_tasks: hardening.yml
  tags: [hardening]

- name: Pre-create Coolify data directory with ACLs
  ansible.builtin.include_tasks: coolify-prepare.yml
  tags: [coolify-prepare]

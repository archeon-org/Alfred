---
# ── SSH hardening ───────────────────────────────

- name: Check if ssh.socket exists
  ansible.builtin.command:
    cmd: systemctl list-unit-files ssh.socket
  register: ssh_socket_check
  changed_when: false
  failed_when: false

- name: Disable and stop ssh.socket (if present)
  ansible.builtin.systemd:
    name: ssh.socket
    state: stopped
    enabled: no
  when: "'ssh.socket' in ssh_socket_check.stdout"
  ignore_errors: true

- name: Enable ssh.service
  ansible.builtin.systemd:
    name: "{{ ssh_service_name }}"
    enabled: yes
    state: started

- name: Remove default SSH config override directory contents
  ansible.builtin.shell: rm -f /etc/ssh/sshd_config.d/*.conf
  changed_when: false

- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
  register: sshd_config_result

- name: Remove small Diffie-Hellman moduli
  ansible.builtin.shell: |
    awk '$5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.safe
    mv /etc/ssh/moduli.safe /etc/ssh/moduli
  changed_when: false

# Restart SSH immediately so port 2222 is live before firewall blocks port 22
- name: Restart SSH service now
  ansible.builtin.systemd:
    name: "{{ ssh_service_name }}"
    state: restarted
    daemon_reload: yes
  when: sshd_config_result.changed

- name: Wait for SSH to come up on new port
  ansible.builtin.wait_for:
    port: "{{ ssh_port }}"
    host: 0.0.0.0
    delay: 2
    timeout: 30
  when: sshd_config_result.changed

- name: Switch Ansible to use new SSH port
  ansible.builtin.set_fact:
    ansible_port: "{{ ssh_port }}"
    ansible_user: "{{ admin_user }}"
    ansible_ssh_private_key_file: "{{ admin_ssh_key_path }}"
    ansible_password: null

---
# ── Kernel hardening (sysctl) ───────────────────

- name: Deploy kernel hardening sysctl parameters
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Apply sysctl parameters immediately
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

---
# ═══════════════════════════════════════════════════
#  Security role — default variables
# ═══════════════════════════════════════════════════

# Admin user
admin_user: "deploy"
admin_user_shell: "/bin/bash"
admin_ssh_key_path: "~/.ssh/archeon_vps"
admin_ssh_key_comment: "archeon-deploy-key"

# SSH
ssh_port: 2222
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_max_auth_tries: 3
ssh_login_grace_time: 20
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
ssh_x11_forwarding: "no"
ssh_allow_agent_forwarding: "yes"
ssh_allow_tcp_forwarding: "yes"
ssh_permit_tunnel: "no"
ssh_max_sessions: 20
ssh_max_startups: "10:30:60"
ssh_allowed_users: "{{ admin_user }}"
ssh_service_name: "ssh"

# Firewall
firewall_allowed_tcp_ports:
  - "80"
  - "443"
firewall_allowed_udp_ports: []
firewall_rate_limit_ssh: true

# Coolify control VPS IP — whitelisted on nodes to bypass SSH rate-limit.
# Dynamically resolved from the inventory's control group.
# Can be overridden via --extra-vars if needed.
coolify_control_ip: "{{ hostvars[groups['control'][0]]['ansible_host'] | default('') }}"

# Fail2ban
fail2ban_bantime: "3600"
fail2ban_findtime: "600"
fail2ban_maxretry: "3"
fail2ban_destemail: "root@localhost"
fail2ban_action: "%(action_)s"

# System
server_timezone: "UTC"
enable_auto_updates: true
kernel_hardening: true

# Packages to install
security_packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  - logwatch
  - rkhunter
  - libpam-tmpdir
  - debsums
  - acl
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - sudo
  - vim
  - htop
  - net-tools
  - jq
  - tmux
  - git

# Packages to remove
packages_to_remove:
  - telnet
  - rsh-client
  - rsh-redone-client

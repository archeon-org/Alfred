---
- name: Deploy Gate and Scribe from GitHub Container Registry
  hosts: archeon-vps
  become: true
  gather_facts: true

  vars:
    registry: ghcr.io
    repository_owner: archeon-org
    gate_image: "{{ registry }}/{{ repository_owner }}/archeon-gate"
    scribe_image: "{{ registry }}/{{ repository_owner }}/archeon-scribe"
    image_tag: "{{ deployment_tag | default('latest') }}"
    app_directory: /opt/archeon
    
  tasks:
    - name: 📂 Ensure application directory exists
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ vault_ssh_user }}"
        group: "{{ vault_ssh_user }}"
        mode: '0755'

    - name: 🐳 Login to GitHub Container Registry
      docker_login:
        registry: "{{ registry }}"
        username: "{{ repository_owner }}"
        password: "{{ vault_ghcr_token }}"

    - name: 📥 Pull latest gate image
      docker_image:
        name: "{{ gate_image }}"
        tag: "{{ image_tag }}"
        source: pull
        force_source: true

    - name: 📥 Pull latest scribe image
      docker_image:
        name: "{{ scribe_image }}"
        tag: "{{ image_tag }}"
        source: pull
        force_source: true

    - name: 🌐 Create Docker network
      docker_network:
        name: archeon-network
        state: present
        driver: bridge

    - name: 📁 Verify environment directories exist
      file:
        path: "{{ app_directory }}/env/{{ item }}"
        state: directory
        owner: "{{ vault_ssh_user }}"
        group: "{{ vault_ssh_user }}"
        mode: '0755'
      loop:
        - gate
        - scribe

    - name: 📝 Update gate environment file
      template:
        src: templates/env/gate.env.j2
        dest: "{{ app_directory }}/env/gate/.env"
        owner: "{{ vault_ssh_user }}"
        group: "{{ vault_ssh_user }}"
        mode: '0600'
        backup: yes

    - name: 📝 Update scribe environment file
      template:
        src: templates/env/scribe.env.j2
        dest: "{{ app_directory }}/env/scribe/.env"
        owner: "{{ vault_ssh_user }}"
        group: "{{ vault_ssh_user }}"
        mode: '0600'
        backup: yes

    - name: 🛑 Stop existing containers if running
      docker_container:
        name: "{{ item }}"
        state: stopped
      ignore_errors: true
      loop:
        - archeon-gate
        - archeon-scribe

    - name: 🗑️ Remove existing containers
      docker_container:
        name: "{{ item }}"
        state: absent
      ignore_errors: true
      loop:
        - archeon-gate
        - archeon-scribe

    - name: 🚀 Start gate container
      docker_container:
        name: archeon-gate
        image: "{{ gate_image }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ vault_gate_port | default('3000') }}:3000"
        env_file: "{{ app_directory }}/env/gate/.env"
        networks:
          - name: archeon-network
        healthcheck:
          test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
        memory: 1g
        log_driver: "json-file"
        log_options:
          max-size: "10m"
          max-file: "3"

    - name: 🚀 Start scribe container
      docker_container:
        name: archeon-scribe
        image: "{{ scribe_image }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ vault_scribe_port | default('3001') }}:3000"
        env_file: "{{ app_directory }}/env/scribe/.env"
        networks:
          - name: archeon-network
        memory: 512m
        log_driver: "json-file"
        log_options:
          max-size: "10m"
          max-file: "3"

    - name: 🗄️ Check if database container is running
      command: docker ps --filter "name=postgres-archeon" --format "{{ '{{' }}.Status{{ '}}' }}"
      register: db_container_check
      ignore_errors: true

    - name: 🗄️ Check if database is accessible
      command: docker exec postgres-archeon pg_isready -U {{ vault_db_user }} -d {{ vault_db_name }}
      register: db_check
      ignore_errors: true
      when: "'Up' in db_container_check.stdout"

    - name: ⚠️ Database not available warning
      debug:
        msg: "⚠️ Database (PostgreSQL) is not running. Please run the database setup playbook first: ansible-playbook ansible/playbooks/03-setup-docker-services.yml"
      when: (db_check is defined and db_check.failed) or ('Up' not in db_container_check.stdout)

    - name: ⏳ Wait for gate to be healthy
      uri:
        url: "http://localhost:{{ vault_gate_port | default('3000') }}/api/health"
        method: GET
        status_code: 200
      register: gate_health
      until: gate_health.status == 200
      retries: 30
      delay: 10
      ignore_errors: true

    - name: 🧹 Clean up old Docker images (keep last 3)
      shell: |
        # Remove old gate images (keep last 3)
        docker images {{ gate_image }} --format "table {{ '{{' }}.Tag{{ '}}' }}\t{{ '{{' }}.ID{{ '}}' }}" | tail -n +2 | head -n -3 | awk '{print $2}' | xargs -r docker rmi || true
        # Remove old scribe images (keep last 3)
        docker images {{ scribe_image }} --format "table {{ '{{' }}.Tag{{ '}}' }}\t{{ '{{' }}.ID{{ '}}' }}" | tail -n +2 | head -n -3 | awk '{print $2}' | xargs -r docker rmi || true
        # Remove dangling images
        docker image prune -f
      ignore_errors: true

    - name: 📋 Display deployment status
      debug:
        msg: |
          🎉 Deployment completed successfully!
          
          Gate: https://{{ vault_gate_domain | default('gate.archeon.com') }} (container: archeon-gate)
          Scribe: https://{{ vault_scribe_domain | default('scribe.archeon.com') }} (container: archeon-scribe)
          
          Image versions deployed:
          - Gate: {{ gate_image }}:{{ image_tag }}
          - Scribe: {{ scribe_image }}:{{ image_tag }}
          
          Environment files:
          - Gate: {{ app_directory }}/env/gate/.env
          - Scribe: {{ app_directory }}/env/scribe/.env
          
          Container status:
          - Gate health: {{ 'OK' if gate_health.status == 200 else 'FAILED' }}
          
          📝 Prerequisites:
          - Make sure PostgreSQL database is running (run 03-setup-docker-services.yml first)
          - Ensure nginx and SSL are configured (run 04-setup-subdomains-https.yml)

    - name: 📊 Show running containers
      command: docker ps --filter "name=archeon-" --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Image{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: container_status
      changed_when: false

    - name: 📊 Display container information
      debug:
        var: container_status.stdout_lines

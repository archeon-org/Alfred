---
# ═══════════════════════════════════════════════════
#  Secure VPS — reusable for ANY new VPS
# ═══════════════════════════════════════════════════
#
#  Usage (initial setup with root + password):
#    ansible-playbook ansible/playbooks/secure-vps.yml --limit <host>
#
#  Usage (re-run after hardening):
#    ansible-playbook ansible/playbooks/secure-vps.yml --limit <host> \
#      -e "ansible_user=deploy ansible_port=2222 ansible_ssh_private_key_file=~/.ssh/archeon_vps"
#
# ═══════════════════════════════════════════════════

- name: "Secure VPS — full hardening"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Wait for system to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - security

  post_tasks:
    - name: Display post-setup connection info
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════
           VPS hardened successfully!

           New connection details:
             User: {{ admin_user }}
             Port: {{ ssh_port }}
             Key:  {{ admin_ssh_key_path }}

           SSH command:
             ssh -i {{ admin_ssh_key_path }} -p {{ ssh_port }} {{ admin_user }}@{{ ansible_host }}

           Update your inventory to use these values
           for future runs.
          ════════════════════════════════════════════

---
- name: Setup All VPS with essential packages and Docker
  hosts: all
  become: true
  gather_facts: true
  
  tasks:
    - name: 📦 Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 🛠️ Install essential system packages
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - nano
          - htop
          - unzip
          - zip
          - tree
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - build-essential
          - python3-pip
          - ufw
          - fail2ban
        state: present
      register: packages_installed

    - name: 🛠️ Install OCR dependencies (Scribe workers only)
      apt:
        name:
          - tesseract-ocr
          - tesseract-ocr-fra
          - tesseract-ocr-eng
          - tesseract-ocr-ara
          - poppler-utils
          - graphicsmagick
        state: present
      when: "'scribe_workers' in group_names"

    - name: ✅ Essential packages installed
      debug:
        msg: "Essential system packages have been installed successfully on {{ inventory_hostname }}"
      when: packages_installed is succeeded

    - name: 🐳 Remove old Docker installations
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent

    - name: 🔑 Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: 📋 Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: 🐳 Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
      register: docker_installed

    - name: 🚀 Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: 👤 Add current user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: 🔧 Configure Docker daemon
      copy:
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "100m",
              "max-file": "3"
            },
            "storage-driver": "overlay2",
            "live-restore": true
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      notify: restart docker

    - name: 🔥 Configure UFW firewall (Main VPS - SSH, HTTP, HTTPS)
      ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { rule: "allow", port: "22", proto: "tcp" }    # SSH
        - { rule: "allow", port: "80", proto: "tcp" }    # HTTP  
        - { rule: "allow", port: "443", proto: "tcp" }   # HTTPS
      when: "'production' in group_names"

    - name: 🔥 Configure UFW firewall (Scribe workers - SSH only)
      ufw:
        rule: allow
        port: "22"
        proto: tcp
      when: "'scribe_workers' in group_names"

    - name: 🛡️ Enable UFW firewall
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: 🧪 Test Docker installation
      command: docker run --rm hello-world
      register: docker_test
      changed_when: false

    - name: 🔍 Get Docker version
      command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false

    - name: ✅ Setup Complete
      debug:
        msg: |
          🎉 VPS Setup Complete for {{ inventory_hostname }}!
          
          Host: {{ inventory_hostname }} ({{ ansible_host }})
          Type: {{ 'Main VPS' if 'production' in group_names else 'Scribe Worker' }}
          
          ✅ Essential packages installed
          ✅ Docker CE installed: {{ docker_version.stdout }}
          ✅ Docker Compose available via plugin
          ✅ Firewall configured
          {% if 'scribe_workers' in group_names %}
          ✅ OCR dependencies installed (Tesseract, Poppler, GraphicsMagick)
          {% endif %}
          
          System Info:
          - OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          - CPU Cores: {{ ansible_processor_vcpus }}
          - Memory: {{ (ansible_memtotal_mb/1024)|round(1) }}GB

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
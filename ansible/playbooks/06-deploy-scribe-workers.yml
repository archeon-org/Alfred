---
# =============================================================================
# Archeon Scribe Workers - Deployment
# =============================================================================
# Prerequisites: 
#   - Run 01-setup-vps.yml to setup Docker and dependencies
#   - Run 02-setup-app-env.yml to create directories and .env files
#
# Run: ansible-playbook ansible/playbooks/06-deploy-scribe-workers.yml
# With tag: ansible-playbook ansible/playbooks/06-deploy-scribe-workers.yml -e "deployment_tag=v1.0.0"
# =============================================================================

- name: Deploy Scribe Workers
  hosts: scribe_workers
  become: true
  gather_facts: true

  vars:
    registry: ghcr.io
    repository_owner: archeon-org
    scribe_image: "{{ registry }}/{{ repository_owner }}/archeon-scribe"
    image_tag: "{{ deployment_tag | default('latest') }}"
    app_directory: /opt/archeon-scribe
    worker_count: "{{ scribe_worker_count | default(3) }}"

  tasks:
    - name: 🐳 Login to GitHub Container Registry
      docker_login:
        registry: "{{ registry }}"
        username: "{{ repository_owner }}"
        password: "{{ vault_ghcr_token }}"

    - name: 📥 Pull latest scribe image
      docker_image:
        name: "{{ scribe_image }}"
        tag: "{{ image_tag }}"
        source: pull
        force_source: true

    - name: 🌐 Create Docker network
      docker_network:
        name: archeon-scribe-network
        state: present
        driver: bridge

    # =========================================================================
    # GRACEFUL SHUTDOWN - Wait for jobs to finish before stopping
    # =========================================================================
    - name: 🔍 Check if scribe workers are running
      command: docker ps -q --filter "name=scribe-worker"
      register: running_workers
      changed_when: false
      ignore_errors: true

    - name: ⏸️ Send SIGTERM to workers for graceful shutdown
      shell: |
        docker kill --signal=SIGTERM "scribe-worker-{{ item }}" 2>/dev/null || true
      loop: "{{ range(1, (worker_count | int) + 1) | list }}"
      when: running_workers.stdout | length > 0

    - name: ⏳ Wait for workers to finish active jobs (max 3 minutes)
      shell: |
        # Wait for container to stop gracefully, or timeout after 180 seconds
        # With optimized OCR (60s timeout + early stop), jobs complete in ~2 min max
        timeout=180
        elapsed=0
        while docker ps -q --filter "name=scribe-worker-{{ item }}" | grep -q .; do
          if [ $elapsed -ge $timeout ]; then
            echo "Timeout reached for scribe-worker-{{ item }}"
            break
          fi
          echo "Waiting for scribe-worker-{{ item }} to finish... ($elapsed seconds)"
          sleep 10
          elapsed=$((elapsed + 10))
        done
        echo "scribe-worker-{{ item }} has stopped or timeout reached"
      loop: "{{ range(1, (worker_count | int) + 1) | list }}"
      when: running_workers.stdout | length > 0
      async: 240  # Slightly more than timeout to allow for command overhead
      poll: 15

    - name: 🛑 Force stop any remaining containers
      docker_container:
        name: "scribe-worker-{{ item }}"
        state: stopped
        stop_timeout: 10
      ignore_errors: true
      loop: "{{ range(1, (worker_count | int) + 1) | list }}"

    - name: 🗑️ Remove existing scribe worker containers
      docker_container:
        name: "scribe-worker-{{ item }}"
        state: absent
      ignore_errors: true
      loop: "{{ range(1, (worker_count | int) + 1) | list }}"

    - name: 🚀 Start scribe worker containers
      docker_container:
        name: "scribe-worker-{{ item }}"
        image: "{{ scribe_image }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        env_file: "{{ app_directory }}/env/.env"
        networks:
          - name: archeon-scribe-network
        memory: 1g
        # Graceful shutdown: Docker will send SIGTERM and wait 120s before SIGKILL
        stop_timeout: 120
        log_driver: "json-file"
        log_options:
          max-size: "50m"
          max-file: "3"
        labels:
          app: "archeon-scribe"
          worker_id: "{{ item }}"
          host: "{{ inventory_hostname }}"
      loop: "{{ range(1, (worker_count | int) + 1) | list }}"

    - name: ⏳ Wait for workers to start
      pause:
        seconds: 10

    - name: 🔍 Check worker container status
      command: docker ps --filter "name=scribe-worker" --format "{{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: worker_status
      changed_when: false

    - name: 🧹 Clean up old Docker images
      shell: |
        docker images {{ scribe_image }} --format "table {{ '{{' }}.Tag{{ '}}' }}\t{{ '{{' }}.ID{{ '}}' }}" | tail -n +2 | head -n -2 | awk '{print $2}' | xargs -r docker rmi || true
        docker image prune -f
      ignore_errors: true

    - name: 📝 Create worker management script
      copy:
        content: |
          #!/bin/bash
          # Archeon Scribe Workers Management
          # Host: {{ inventory_hostname }}
          
          # With optimized OCR (60s timeout + early stop), jobs complete in ~2 min max
          TIMEOUT=${GRACEFUL_TIMEOUT:-180}  # 3 minutes default
          
          graceful_stop() {
            echo "⏸️ Sending SIGTERM to workers for graceful shutdown..."
            docker ps -q --filter "name=scribe-worker" | xargs -r docker kill --signal=SIGTERM
            
            echo "⏳ Waiting for workers to finish active jobs (max $TIMEOUT seconds)..."
            elapsed=0
            while docker ps -q --filter "name=scribe-worker" | grep -q .; do
              if [ $elapsed -ge $TIMEOUT ]; then
                echo "⚠️ Timeout reached. Force stopping remaining containers..."
                docker ps -q --filter "name=scribe-worker" | xargs -r docker stop -t 10
                break
              fi
              sleep 5
              elapsed=$((elapsed + 5))
              active=$(docker ps -q --filter "name=scribe-worker" | wc -l)
              echo "  Still running: $active workers ($elapsed seconds elapsed)"
            done
            echo "✅ All workers stopped"
          }
          
          case "$1" in
            start)
              echo "🚀 Starting all scribe workers..."
              docker start $(docker ps -aq --filter "name=scribe-worker")
              ;;
            stop)
              echo "🛑 Stopping all scribe workers (immediate)..."
              docker stop $(docker ps -q --filter "name=scribe-worker")
              ;;
            graceful-stop)
              graceful_stop
              ;;
            restart)
              echo "🔄 Restarting all scribe workers..."
              docker restart $(docker ps -q --filter "name=scribe-worker")
              ;;
            graceful-restart)
              echo "🔄 Graceful restart: stopping workers then starting..."
              graceful_stop
              echo "🚀 Starting all scribe workers..."
              docker start $(docker ps -aq --filter "name=scribe-worker")
              ;;
            logs)
              if [ -z "$2" ]; then
                docker logs -f scribe-worker-1
              else
                docker logs -f "scribe-worker-$2"
              fi
              ;;
            status)
              docker ps --filter "name=scribe-worker" --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Image{{ '}}' }}"
              ;;
            *)
              echo "Usage: $0 {start|stop|graceful-stop|restart|graceful-restart|logs [worker_number]|status}"
              echo ""
              echo "Commands:"
              echo "  start            - Start all stopped workers"
              echo "  stop             - Immediately stop all workers (may interrupt jobs!)"
              echo "  graceful-stop    - Send SIGTERM and wait for jobs to finish"
              echo "  restart          - Immediately restart all workers"
              echo "  graceful-restart - Gracefully stop, then start all workers"
              echo "  logs [n]         - Tail logs for worker n (default: 1)"
              echo "  status           - Show status of all workers"
              echo ""
              echo "Environment variables:"
              echo "  GRACEFUL_TIMEOUT - Seconds to wait for graceful stop (default: 300)"
              exit 1
              ;;
          esac
        dest: "{{ app_directory }}/manage-workers.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: ✅ Deployment Complete
      debug:
        msg: |
          🎉 Scribe Workers Deployment Complete!
          
          Host: {{ inventory_hostname }} ({{ ansible_host }})
          Image: {{ scribe_image }}:{{ image_tag }}
          Workers deployed: {{ worker_count }}
          
          Worker containers:
          {{ worker_status.stdout }}
          
          📡 Connecting to main VPS:
          - Redis: {{ vault_vps_ip }}:6379
          - PostgreSQL: {{ vault_vps_ip }}:5432
          
          🔧 Management: {{ app_directory }}/manage-workers.sh {start|stop|restart|logs|status}

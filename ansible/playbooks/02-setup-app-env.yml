---
# =============================================================================
# Setup Application Environment for ALL VPS
# =============================================================================
# - Main VPS: /opt/archeon with Gate environment
# - Worker VPS: /opt/archeon-scribe with Scribe worker environment
# =============================================================================

- name: Setup Application Environment (Main VPS)
  hosts: production
  become: true
  gather_facts: true
  
  vars:
    app_directory: "/opt/archeon"
    
  tasks:
    - name: 📁 Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: 📁 Create env directory structure for Gate
      file:
        path: "{{ app_directory }}/env/gate"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: 📝 Generate gate environment file from template
      template:
        src: templates/env/gate.env.j2
        dest: "{{ app_directory }}/env/gate/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        backup: yes

    - name: 📋 Create additional directories
      file:
        path: "{{ app_directory }}/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - logs
        - data
        - backups
        - uploads

    - name: ✅ Main VPS environment setup complete
      debug:
        msg: |
          🎉 Main VPS Environment Setup Complete!
          
          📁 Directory: {{ app_directory }}/
          ├── env/gate/.env
          ├── logs/
          ├── data/
          ├── backups/
          └── uploads/

# =============================================================================
# Setup Scribe Worker Environment
# =============================================================================

- name: Setup Application Environment (Scribe Workers)
  hosts: scribe_workers
  become: true
  gather_facts: true
  
  vars:
    app_directory: "/opt/archeon-scribe"
    
  tasks:
    - name: 📁 Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: 📁 Create env directory
      file:
        path: "{{ app_directory }}/env"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: 📝 Generate scribe worker environment file from template
      template:
        src: templates/env/scribe-worker.env.j2
        dest: "{{ app_directory }}/env/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        backup: yes

    - name: 📋 Create additional directories
      file:
        path: "{{ app_directory }}/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - logs

    - name: ✅ Scribe Worker environment setup complete
      debug:
        msg: |
          🎉 Scribe Worker Environment Setup Complete!
          
          Host: {{ inventory_hostname }} ({{ ansible_host }})
          
          📁 Directory: {{ app_directory }}/
          ├── env/.env (connects to main VPS Redis/PostgreSQL)
          └── logs/

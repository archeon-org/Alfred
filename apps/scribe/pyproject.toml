[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribe"
version = "1.0.0"
description = "Archeon Scribe - Document Processing Microservice with Celery Workers"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [
    { name = "Archeon Team" }
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    
    # Celery & Redis
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "kombu>=5.4.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.0",
    
    # AWS S3 / Cloudflare R2
    "boto3>=1.35.0",
    
    # AI / LLM
    "openai>=1.57.0",
    
    # Knowledge Graph (Graphiti)
    "graphiti-core>=0.5.0",
    "neo4j>=5.20.0",
    
    # Document Chunking
    "chonkie>=1.5.1",
    
    # OCR
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=11.0.0",
    
    # Configuration & Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    
    # Security
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    
    # Utilities
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    
    # Monitoring
    "prometheus-fastapi-instrumentator>=7.0.0",
    
    # LangSmith for LLM observability
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

lightrag = [
    "lightrag-hku>=1.0.0",
    "nano-vectordb>=0.0.10",
]

[project.scripts]
scribe-api = "scribe.main:main"
scribe-worker = "scribe.worker:main"
scribe-format = "scribe.scripts.format:format"
scribe-check = "scribe.scripts.format:check"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert usage
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/scribe --cov-report=term-missing"
